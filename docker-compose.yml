version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: production-postgres
    environment:
      POSTGRES_DB: collab_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - collab-network

  redis-cache:
    image: redis:7-alpine
    container_name: production-redis
    ports:
      - "6379:6379"
    networks:
      - collab-network

  backend-api:
    image: node:20-alpine
    container_name: production-backend
    working_dir: /app
    command: sh -c "npm install && npx prisma db push && npm run start"
    volumes:
      - ./collab-backend:/app
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres@postgres-db:5432/collab_db?schema=public"
      REDIS_URL: "redis://redis-cache:6379"
      JWT_SECRET: "production_cryptographic_cluster_salt_key_98765"
    ports:
      - "5000:5000"
    depends_on:
      - postgres-db
      - redis-cache
    networks:
      - collab-network

  frontend-client:
    image: node:20-alpine
    container_name: production-frontend
    working_dir: /app
    command: sh -c "npm install && npm run build && npm run dev -- --host"
    volumes:
      - ./collab-frontend:/app
    ports:
      - "5174:5174"
    depends_on:
      - backend-api
    networks:
      - collab-network

volumes:
  postgres_prod_data:

networks:
  collab-network:
    driver: bridge
